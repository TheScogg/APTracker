<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">Take Photo Multicolor</title>
  <desc id="desc">A sleek multicolor camera icon with a cyan to blue gradient body, teal lens ring, and warm yellow status dot.</desc>
  <defs>
    <linearGradient id="cameraStroke" x1="3" y1="4.75" x2="21.25" y2="19.75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FE6D5"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="lensStroke" x1="8.4" y1="9.4" x2="15.6" y2="16.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AF7EC"/>
      <stop offset="1" stop-color="#34C8FF"/>
    </linearGradient>
    <radialGradient id="lensFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 13) rotate(90) scale(4.4)">
      <stop offset="0" stop-color="#7CF3FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0.04"/>
    </radialGradient>
  </defs>

  <path d="M7.5 6.5 9 4.75h6l1.5 1.75H19A2.25 2.25 0 0 1 21.25 8.75v8.75A2.25 2.25 0 0 1 19 19.75H5A2.25 2.25 0 0 1 2.75 17.5V8.75A2.25 2.25 0 0 1 5 6.5h2.5Z"
        stroke="url(#cameraStroke)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="12" cy="13" r="3.6" fill="url(#lensFill)" stroke="url(#lensStroke)" stroke-width="1.45"/>

  <circle cx="12" cy="13" r="1.55" fill="#DDF8FF" fill-opacity="0.9"/>
  <circle cx="18.1" cy="9.2" r="0.8" fill="#FFD166"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">Choose Photo Multicolor</title>
  <desc id="desc">A sleek multicolor gallery icon with a cyan to blue gradient frame, teal mountain strokes, and a warm yellow sun accent.</desc>
  <defs>
    <linearGradient id="frameStroke" x1="3.25" y1="4.25" x2="20.75" y2="19.75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FE6D5"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="sceneStroke" x1="6.5" y1="11" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AF7EC"/>
      <stop offset="1" stop-color="#34C8FF"/>
    </linearGradient>
    <radialGradient id="sceneFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 13.2) rotate(90) scale(6.4 8.5)">
      <stop offset="0" stop-color="#7CF3FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0.03"/>
    </radialGradient>
  </defs>

  <rect x="3.25" y="4.25" width="17.5" height="15.5" rx="2.75" fill="url(#sceneFill)" stroke="url(#frameStroke)" stroke-width="1.45"/>
  <path d="M6.8 15.25 10.1 11.95l2.9 2.9 2.65-2.65 1.55 1.55" stroke="url(#sceneStroke)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6.95 16.15h10.15" stroke="url(#sceneStroke)" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
  <circle cx="17.25" cy="8.55" r="1.45" fill="#FFD166"/>
</svg>

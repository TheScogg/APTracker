  <path d="M12 4.5v2.3" stroke="url(#beamStroke)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M7.25 6.4v2.15" stroke="url(#beamStroke)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M16.75 6.4v2.15" stroke="url(#beamStroke)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M12 9.2 6.2 13v4.35l5.8-3.35 5.8 3.35V13L12 9.2Z" fill="url(#badgeFill)" stroke="url(#badgeStroke)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 16.2 12 14.45 15 16.2" stroke="url(#innerStroke)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="11.4" r="0.7" fill="#FFD166"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">High Priority Multicolor</title>
  <desc id="desc">A sleek multicolor high priority badge with warm orange amber energy accents and cool cyan structural lines.</desc>
  <defs>
    <linearGradient id="badgeStroke" x1="6.2" y1="9.2" x2="17.8" y2="17.35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB35C"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="innerStroke" x1="9" y1="14.45" x2="15" y2="16.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AF7EC"/>
      <stop offset="1" stop-color="#34C8FF"/>
    </linearGradient>
    <linearGradient id="beamStroke" x1="7.25" y1="6.1" x2="16.75" y2="6.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FE6D5"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="badgeFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 14.2) rotate(90) scale(5.8 6.2)">
      <stop offset="0" stop-color="#FFE8AE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFB35C" stop-opacity="0.05"/>
    </radialGradient>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">More Multicolor</title>
  <desc id="desc">A sleek multicolor more icon with three softly glowing dots in cyan, aqua, and blue.</desc>
  <defs>
    <radialGradient id="dot1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(6 12) rotate(90) scale(2.2)">
      <stop offset="0" stop-color="#B5FFF7"/>
      <stop offset="1" stop-color="#2FE6D5"/>
    </radialGradient>
    <radialGradient id="dot2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 12) rotate(90) scale(2.2)">
      <stop offset="0" stop-color="#DDF8FF"/>
      <stop offset="1" stop-color="#34C8FF"/>
    </radialGradient>
    <radialGradient id="dot3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 12) rotate(90) scale(2.2)">
      <stop offset="0" stop-color="#DCE7FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </radialGradient>
  </defs>

  <circle cx="6" cy="12" r="1.35" fill="url(#dot1)"/>
  <circle cx="12" cy="12" r="1.35" fill="url(#dot2)"/>
  <circle cx="18" cy="12" r="1.35" fill="url(#dot3)"/>
</svg>

name: Backup Cloudflare D1

on:
  schedule:
    # Approximately 2–3 AM Eastern, depending on daylight saving time.
    - cron: "15 7 * * *"

  # Allows you to test or run the backup manually.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Export D1 database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Change this to the exact D1 database name shown in Cloudflare.
      D1_DATABASE_NAME: coe_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create backup filename
        id: backup
        shell: bash
        run: |
          TIMESTAMP="$(date -u +'%Y-%m-%d_%H-%M-%S_UTC')"
          BACKUP_DIR="d1-backups"
          BACKUP_FILE="${BACKUP_DIR}/ap-tracker-${TIMESTAMP}.sql"

          mkdir -p "$BACKUP_DIR"

          echo "file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact=ap-tracker-d1-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Export remote D1 database
        run: |
          npx --yes wrangler@4 d1 export "$D1_DATABASE_NAME" \
            --remote \
            --output="${{ steps.backup.outputs.file }}"

      - name: Verify backup
        shell: bash
        run: |
          BACKUP_FILE="${{ steps.backup.outputs.file }}"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "::error::The D1 backup file is missing or empty."
            exit 1
          fi

          echo "Backup created successfully:"
          ls -lh "$BACKUP_FILE"

          echo "SHA-256:"
          sha256sum "$BACKUP_FILE"

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 9